# 本機驗證環境；postgres 與 moto 只在本機使用，雲端改用 RDS／S3／SES。
name: aws-livefit-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: livefit
      POSTGRES_PASSWORD: local-only-demo
      POSTGRES_DB: livefit
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15439:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -U livefit -d livefit]
      interval: 5s
      timeout: 3s
      retries: 10
  moto:
    image: motoserver/moto:5.1.11
    ports:
      - "127.0.0.1:15000:5000"
  backend:
    build: .
    ports:
      - "127.0.0.1:3080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: livefit
      DB_PASSWORD: local-only-demo
      DB_DATABASE: livefit
      DB_SYNCHRONIZE: 'true'
      DB_ENABLE_SSL: 'false'
      JWT_SECRET: local-only-livefit-demo-secret
      JWT_EXPIRES_DAY: 1d
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local-test
      AWS_SECRET_ACCESS_KEY: local-test
      AWS_ENDPOINT_URL: http://moto:5000
      S3_BROWSER_ENDPOINT: http://localhost:15000
      S3_BUCKET: livefit-local-photos
      EMAIL_MODE: ses
      SES_FROM_EMAIL: teacher@example.com
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  database:
