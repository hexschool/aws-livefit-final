name: AWS LiveFit local verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: http://localhost:3080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Start local PostgreSQL and AWS emulator
        run: docker compose up -d --build --wait
      - run: node backend/scripts/init-local-aws.js
      - run: npm run test:contracts
      - run: npm run test:aws
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 80 backend postgres
      - name: Stop this test environment
        if: always()
        run: docker compose down
